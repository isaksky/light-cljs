[package]
name = "light-cljs"
version = "0.1.0"
edition = "2024"
description = "ClojureScript-to-JavaScript compiler and QuickJS runner written in Rust"
authors = ["Isak Sky"]
repository = "https://github.com/isaksky/light-cljs"
readme = "README.md"
# MIT for original work; files adapted from ClojureScript and SCI stay EPL-1.0.
# See LICENSE, epl-v10.html and THIRD_PARTY_NOTICES.md.
license = "MIT AND EPL-1.0"

[workspace]
members = ["crates/big-boy-pants-js/rust"]
default-members = ["."]
exclude = ["vendor/v8", "vendor/rquickjs-sys", "playground/crate"]
resolver = "3"

[workspace.dependencies]
big-boy-pants-js = { path = "crates/big-boy-pants-js/rust" }

# QuickJS is the default native interactive and data-reader engine. The optional
# feature also permits builds containing only big-boy-pants-js or no engine.
# WebAssembly builds leave it out: their
# embedder supplies the engine (`host_evaluator::ScriptHost`, light-cljs-357).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "=0.14.0", optional = true, default-features = false, features = ["std"] }
mimalloc = "=0.1.52"

[target.'cfg(all(any(target_arch = "aarch64", target_arch = "x86_64"), any(target_os = "macos", target_os = "linux", target_os = "windows")))'.dependencies]
v8 = { version = "=152.2.0", path = "vendor/v8", optional = true, features = ["v8_enable_pointer_compression"] }

[build-dependencies]
cc = "=1.7.0"

[features]
default = ["v8-macros", "quickjs"]
quickjs = ["dep:rquickjs"]
bbp-macros = ["dep:big-boy-pants-js"]
# Bounded source-macro experiment; requires an explicitly built Goose runner.
goose-macros = ["bbp-macros"]
# Test-only scheduler perturbation in optimized builds of large projects.
# Ordinary release builds omit it; no engine or production default changes.
scheduling-stress = []
# Native clean compilations use V8; interactive sessions use QuickJS, and wasm
# embeds no engine (light-cljs-357).
v8-macros = ["dep:v8"]
# Benchmark-only allocation instrumentation, absent from normal timing runs.
count-allocations = []

[dependencies]
big-boy-pants-js = { workspace = true, optional = true }

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "subset"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "compiler"
harness = false
# Its level and callee benchmarks time QuickJS beside Node.
required-features = ["quickjs"]

[[bench]]
name = "evaluator"
harness = false

# The evaluator example embeds QuickJS, which the Pants build leaves out.
[[example]]
name = "evaluator"
required-features = ["quickjs"]

# Dependencies (chiefly the QuickJS C engine behind the macro host and evaluator)
# build once, so optimizing them costs nothing in the edit loop and makes
# QuickJS-heavy tests 2-3x faster. This crate itself stays unoptimized: at
# opt-level 1 the test suite took 10% less time, but each rebuild after an edit
# under src/ took about 3 s longer (light-cljs-223).
[profile.dev.package."*"]
opt-level = 3

# Ship the same optimized compiler configuration used by the cold-build runs.
[profile.release]
lto = "thin"
codegen-units = 1

# Bundled QuickJS carries a local fix; see vendor/rquickjs-sys/PATCHES.md.
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
