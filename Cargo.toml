[package]
name = "light-cljs"
version = "0.1.0"
edition = "2024"

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

[features]
# Benchmark-only allocation instrumentation, absent from normal timing runs.
count-allocations = []

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "subset"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "compiler"
harness = false

[[bench]]
name = "evaluator"
harness = false
