[package]
name = "light-cljs"
version = "0.1.0"
edition = "2024"
description = "ClojureScript-to-JavaScript compiler and V8 runner written in Rust"
authors = ["Isak Sky"]
repository = "https://github.com/isaksky/light-cljs"
readme = "README.md"
# MIT for original work; files adapted from ClojureScript and SCI stay EPL-1.0.
# See LICENSE, epl-v10.html and THIRD_PARTY_NOTICES.md.
license = "MIT AND EPL-1.0"

[workspace]
exclude = ["playground/crate"]
resolver = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "=0.1.52"

# V8 is the stock prebuilt engine of the `v8` crate. Its release ships
# pointer-compressed engines only for macOS and x86_64 Linux, so those use
# pointer compression and Windows and aarch64 Linux use the plain engine
# (build.rs defines `V8_COMPRESS_POINTERS` for the C++ shims to match).
[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
v8 = { version = "=152.2.0", optional = true, features = ["v8_enable_pointer_compression"] }

[target.'cfg(any(all(target_os = "windows", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
v8 = { version = "=152.2.0", optional = true }

[build-dependencies]
cc = "=1.7.0"

[features]
default = ["v8-macros"]
# Test-only scheduler perturbation in optimized builds of large projects.
# Ordinary release builds omit it; no engine or production default changes.
scheduling-stress = []
# Use V8 for clean compilations, interactive sessions and the public Evaluator.
# WebAssembly embeds no engine (light-cljs-357).
v8-macros = ["dep:v8"]
# Benchmark-only allocation instrumentation, absent from normal timing runs.
count-allocations = []

[lib]
# Benchmarks live in benches/. The library's unit-test harness is for cargo test.
bench = false

[[bench]]
name = "tokenizer"
harness = false

[[bench]]
name = "subset"
harness = false

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "compiler"
harness = false

[[bench]]
name = "evaluator"
harness = false

# Ship the same optimized compiler configuration used by the cold-build runs.
[profile.release]
lto = "thin"
codegen-units = 1
