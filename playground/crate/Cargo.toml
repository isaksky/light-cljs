[package]
name = "light-cljs-playground"
version = "0.1.0"
edition = "2024"
publish = false
description = "The browser playground's WebAssembly entry: light-cljs compiled for wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Without V8, which wasm32 cannot link anyway; QuickJS is left out on wasm32
# by the root crate itself (light-cljs-357).
light-cljs = { path = "../..", default-features = false }
# Pinned: the wasm-bindgen CLI that playground/build.bb runs must match exactly.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
