[package]
name = "light-cljs-playground"
version = "0.1.0"
edition = "2024"
publish = false
description = "The browser playground's WebAssembly entry: light-cljs compiled for wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]

[dependencies]
light-cljs = { path = "../.." }
# Pinned: the wasm-bindgen CLI that playground/build.bb runs must match exactly.
wasm-bindgen = "=0.2.129"

# The same engine fix as the root crate; patches only apply from the build root.
[patch.crates-io]
rquickjs-sys = { path = "../../vendor/rquickjs-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3
