name: Pages

# Builds the landing page in site/ and the browser playground, and publishes
# them to https://isaksky.github.io/light-cljs/ (`bb site/build.bb serve`
# reproduces the result locally).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same toolchain steps as the conformance `playground` job.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          # Must match the pin in playground/crate/Cargo.toml.
          tool: wasm-bindgen@0.2.129
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
      # The module compiles no C (light-cljs-357), so no wasm32 clang or llvm-ar.
      - run: bb --version
      - run: bb playground/build.bb build
      # A playground that fails its checks must not deploy.
      - run: bb playground/build.bb check
      - run: bb site/build.bb build --reuse-playground
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
