name: Conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Rust and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: cargo check --locked --all-features
      - run: cargo test --locked
      - name: Require canonical consumers with interpreter absent
        if: ${{ !cancelled() }}
        run: python3 -B tests/reference/evaluator-migration/gate.py --artifacts /tmp/light-cljs-evaluator-gate
      - name: Preserve evaluator gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluator-migration-gate
          path: /tmp/light-cljs-evaluator-gate
          if-no-files-found: error

  conformance:
    name: Required pinned ClojureScript conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Clojure CLI
        shell: bash
        run: |
          curl --fail --silent --show-error --location --output install-clojure.sh https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x install-clojure.sh
          sudo ./install-clojure.sh
          clojure -Sdescribe
          java -version
          node --version
          rustc --version
      - name: Provision pinned reference compiler
        run: clojure -Srepro -Sdeps '{:deps {org.clojure/clojurescript {:mvn/version "1.12.134"}}}' -P
      - name: Fetch exact compiler source
        run: |
          git init research/clojurescript
          git -C research/clojurescript remote add origin https://github.com/clojure/clojurescript.git
          git -C research/clojurescript fetch --depth 1 origin a5e94c988fd0b50ffcff1ce6add12ffbb7839a3e
          git -C research/clojurescript checkout --detach FETCH_HEAD
      - name: Verify the complete assertion inventory
        run: python3 -B tests/reference/compiler-language/extract_inventory.py --check
      - name: Check full language ledger accounting
        run: python3 -B tests/reference/compiler-language/test_full_ledger.py
      - name: Publish full intended-language completion gaps
        shell: bash
        run: |
          if python3 -B tests/reference/compiler-language/report.py --strict \
              --output /tmp/light-cljs-language-full-scope.json; then
            echo "Full intended-language scope is complete."
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "Full intended-language scope remains incomplete; see missing obligations and Pellet owners in the report."
          fi
      - name: Required result and effect comparisons
        env:
          LIGHT_CLJS_REFERENCE: both
          LIGHT_CLJS_REFERENCE_CHECKOUT: ${{ github.workspace }}/research/clojurescript
          LIGHT_CLJS_REFERENCE_REVISION: a5e94c988fd0b50ffcff1ce6add12ffbb7839a3e
          LIGHT_CLJS_REFERENCE_TIMEOUT_SECONDS: '180'
        run: cargo test --locked --test execution -- --ignored --nocapture --test-threads=1
      - name: Require focused evaluator migration comparisons
        run: python3 -B tests/reference/evaluator-migration/gate.py --reference --checkout research/clojurescript --artifacts /tmp/light-cljs-evaluator-reference
      - name: Require historical selected language assertions
        run: |
          python3 -B tests/reference/compiler-language/report.py --scope historical-selected --run --strict \
            --reference both --checkout research/clojurescript \
            --artifacts /tmp/light-cljs-language-conformance \
            --output /tmp/light-cljs-language-conformance.json
      - name: Preserve compiler conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-language-diagnostics
          path: |
            /tmp/light-cljs-language-conformance*
            /tmp/light-cljs-language-full-scope.json
            /tmp/light-cljs-reference-*
            /tmp/light-cljs-evaluator-reference
          if-no-files-found: error

  sci-reference:
    name: Historical pinned SCI observations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Clojure CLI
        run: |
          curl --fail --silent --show-error --location --output install-clojure.sh https://download.clojure.org/install/linux-install-1.12.4.1618.sh
          chmod +x install-clojure.sh
          sudo ./install-clojure.sh
      - name: Fetch exact SCI source
        run: |
          git init sci-reference
          git -C sci-reference remote add origin https://github.com/babashka/sci.git
          git -C sci-reference fetch --depth 1 origin 5fe89056384418be50d232b4278344cb3a1a526b
          git -C sci-reference checkout --detach FETCH_HEAD
      - name: Check launcher failure enforcement without Java
        run: python3 -m unittest discover -s tests/reference/sci -p 'test_regenerate.py' -v
      - name: Compare all historical oracle observations
        run: python3 tests/reference/sci/regenerate.py --checkout sci-reference
      - name: Preserve historical reference diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-sci-diagnostics
          path: /tmp/light-cljs-sci-reference-*
          if-no-files-found: error
